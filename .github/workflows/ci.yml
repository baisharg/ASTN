# CI workflow for ASTN
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vite+
        id: cache-viteplus
        uses: actions/cache@v4
        with:
          path: ~/.vite-plus
          key: viteplus-0.1.14

      - name: Setup Vite+
        if: steps.cache-viteplus.outputs.cache-hit != 'true'
        run: curl -fsSL https://vite.plus | bash

      - name: Add Vite+ to PATH
        run: echo "$HOME/.vite-plus/bin" >> $GITHUB_PATH

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint && pnpm run lint:convex

      - name: Typecheck Convex backend
        run: pnpm exec tsc -p convex/tsconfig.json --noEmit

      - name: Build
        run: pnpm run build

      # The existing tests are written for Bun's test runner.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Test
        run: bun test src convex
